# Default configuration shipped with the package. Do not edit this file on a robot.
# Override in config/hardware.yaml (chassis wiring) and config/local.yaml (per-robot).
# Every key is validated by robot.core.config; unknown keys are an error on purpose.

system:
  name: buddy
  log_level: INFO
  temp_throttle_c: 75.0
  temp_critical_c: 82.0
  hang_timeout_s: 20    # a stalled service dumps its stack and exits, and gets restarted

bus:
  xsub: tcp://127.0.0.1:7770
  xpub: tcp://127.0.0.1:7771
  heartbeat_s: 1.0

display:
  backend: auto        # auto | kms | fbdev | spi | i2c | window | null
  device: auto
  controller: auto     # st7789 | ili9341 | ili9488 | gc9a01 | ssd1306 | sh1106
  shape: auto          # auto | rect | round
  rotation: 0
  flip: none
  color: auto
  scale_mode: fit
  target_fps: 30
  min_fps: 15
  brightness: 1.0
  fullscreen: false    # window backend only: cover the desktop (set by `robot autostart install`)
  sdl_driver: auto     # window backend: auto | x11 | wayland | kmsdrm (auto prefers x11 on a Wayland desktop)
  spi:
    bus: 0
    device: 0
    speed_hz: 62500000
    pin_dc: 25
    pin_reset: 4
    pin_backlight: 24
  i2c_address: 0x3C

face:
  eye_color: "#3EE0E6"
  background: "#000000"
  design_scale: 1.15
  eye_separation: 1.0
  blink_interval_s: [2.5, 6.5]
  blink_duration_ms: 180
  saccade_interval_s: [0.8, 3.0]
  idle_drift: true
  transition_ms: 220
  antialias: true
  indicators: true   # level bars while listening, dots while thinking
  mouth: true        # animated mouth, shown only while speaking

camera:
  backend: auto        # auto | csi | uvc | rtsp | file | synthetic | null
  device: auto
  width: 640
  height: 480
  fps: 30
  format: auto         # auto | MJPG | YUYV | NV12
  rotation: 0
  flip: none
  mirror_preview: true

perception:
  backend: auto        # auto | hailo | cpu | null
  hailo_arch: auto
  detect_every_n: 1
  min_face_px: 40
  score_threshold: 0.6
  match_threshold: null   # null = backend default (SFace 0.363, ArcFace 0.5)
  recognize_votes: 3
  lost_after_s: 1.5
  publish_hz: 10

voice:
  enabled: true
  wake:
    engine: auto       # auto | openwakeword | sherpa_kws | fake | none
    model: hey_jarvis_v0.1
    threshold: 0.5
  stt:
    engine: auto       # auto | sherpa_moonshine | sherpa_whisper | fake | none
    model: sherpa-onnx-moonshine-tiny-en-int8
    num_threads: 2
  tts:
    engine: auto       # auto | sherpa_vits | fake | none
    voice: vits-piper-en_US-lessac-medium
    speed: 1.0
    num_threads: 2
  audio:
    input_device: null
    output_device: null
    sample_rate: 16000
    block_ms: 80
    lead_in_ms: 0        # silence before each utterance; 400 for a Bluetooth speaker that clips the first word
  vad:
    silence_ms: 700
    max_utterance_s: 12
    min_speech_ms: 250
  listen_timeout_s: 8
  listen_on_presence: true   # someone the camera sees starts talking -> listen, no wake word needed
  presence_preroll_ms: 600   # audio kept from before the trigger so the first word is not lost
  after_speech_guard_ms: 1200  # ignore the mic this long after the robot finishes talking
  presence_min_speech_ms: 240  # speech must last this long before presence listening starts

brain:
  backend: auto        # auto | openai_compat | scripted
  endpoint: http://127.0.0.1:8080/v1
  model: default
  managed: none        # none | llama_server
  model_file: gemma-3-1b-it-Q4_K_M.gguf
  llama_server:
    binary: llama-server
    host: 127.0.0.1
    port: 8080
    threads: 3
    ctx_size: 2048
  max_tokens: 120
  temperature: 0.7
  timeout_s: 30
  rss_budget_mb: 2500

actuators:
  # No actuators until you declare them. Copy a layout (A pan/tilt head + drive, B tilt + lift
  # arm + drive, C four servos) from config/hardware.example.yaml into config/hardware.yaml.
  # With `none` the motion service opens no GPIO and the safety interlock has nothing to gate.
  layout: none
  drivers:
    dc:
      type: none       # tb6612fng | drv8833 | none
      pins: {pwma: 12, ain1: 5, ain2: 6, pwmb: 13, bin1: 14, bin2: 15, standby: 26}
      pwm_hz: 20000
      hardware_pwm: true
    servo:
      type: none       # pca9685 | gpio_pwm | none
      i2c_bus: 1
      i2c_address: 0x40
      pwm_hz: 50
      oe_pin: 16
  channels: {}
  geometry:
    wheel_diameter_mm: 40
    track_width_mm: 95
    ticks_per_mm: null
  max_speed_mm_s: 250
  max_turn_deg_s: 180

safety:
  enable_pin: 26
  enable_mode: level     # level | pulse. Any build with a drivetrain should use pulse (HARDWARE.md 5.3)
  heartbeat_hz: 100      # square wave on the enable line in pulse mode; see HARDWARE.md 5.3
  motion_heartbeat_timeout_ms: 500
  startup_grace_s: 2.0
  cliff:
    enabled: false
    mux_address: 0x70
    sensor_address: 0x29
    poll_hz: 20
    sensors:
      - {name: front, mux_channel: 0, threshold_mm: 60}
      - {name: left, mux_channel: 1, threshold_mm: 60}
      - {name: right, mux_channel: 2, threshold_mm: 60}
  imu:
    enabled: false
    type: mpu6050
    i2c_address: 0x68
    pickup_accel_g: 1.35
    tilt_deg: 35

memory:
  path: null
  greet_cooldown_s: 900
  max_facts_per_person: 50

openmv:
  # OpenMV camera board on USB running openmv/main.py (docs/OPENMV.md). When enabled, also set
  # camera.backend: bus and display.backend: bus so frames and the face travel over the bridge.
  enabled: false
  port: auto           # /dev/ttyACM0, /dev/serial/by-id/..., or auto
  width: 320           # camera frame sent to the Pi (320x240 or 640x480)
  height: 240
  jpeg_quality: 70
  fps: 10
  leds: false          # illumination LEDs on P9, if the unit has them wired there
  lcd_width: 128       # the board's own screen; the face is rendered at this size
  lcd_height: 160
  lcd_fps: 8           # the board redraws its screen in software; 8 keeps the camera flowing

power:
  enabled: false
  ina219_address: 0x41
  i2c_bus: 1
  poll_s: 5
  cells: 2
  low_voltage: 6.6
  critical_voltage: 6.2

orchestrator:
  sleep_after_s: 300
  greet: true
  greet_unknown: true
  attention_timeout_s: 20
  tick_hz: 10
  camera_hfov_deg: 66     # Camera Module 3 standard: 66 x 41 degrees
  camera_vfov_deg: 41
  track_with_head: true
  mirror_gaze: true
  history_turns: 6
