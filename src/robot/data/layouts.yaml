# Actuator layouts A, B, C. `robot sim --layout` and `load_config(layout=...)` merge one of
# these into `actuators`. config/hardware.example.yaml shows the same three for copying into
# config/hardware.yaml; a test keeps the two files identical.
layouts:
  A:
    layout: A
    drivers:
      dc:
        type: tb6612fng
        pins:
          pwma: 12
          ain1: 5
          ain2: 6
          pwmb: 13
          bin1: 14
          bin2: 15
          standby: 26
        pwm_hz: 20000
      servo:
        type: pca9685
        i2c_address: 64
        pwm_hz: 50
        oe_pin: 16
    channels:
      drive_left:
        role: drive
        driver: dc
        motor: a
        invert: false
        encoder:
          pin_a: 17
          pin_b: 27
          ticks_per_rev: 700
      drive_right:
        role: drive
        driver: dc
        motor: b
        invert: true
        encoder:
          pin_a: 22
          pin_b: 23
          ticks_per_rev: 700
      head_pan:
        role: pan
        driver: servo
        channel: 0
        min_deg: -70
        max_deg: 70
        center_us: 1500
        us_per_deg: 10.0
        max_deg_s: 180
      head_tilt:
        role: tilt
        driver: servo
        channel: 1
        min_deg: -30
        max_deg: 35
        center_us: 1500
        us_per_deg: 10.0
        max_deg_s: 180
    geometry:
      wheel_diameter_mm: 40
      track_width_mm: 95
  B:
    layout: B
    drivers:
      dc:
        type: tb6612fng
        pins:
          pwma: 12
          ain1: 5
          ain2: 6
          pwmb: 13
          bin1: 14
          bin2: 15
          standby: 26
        pwm_hz: 20000
      servo:
        type: pca9685
        i2c_address: 64
        pwm_hz: 50
        oe_pin: 16
    channels:
      drive_left:
        role: drive
        driver: dc
        motor: a
        invert: false
        encoder:
          pin_a: 17
          pin_b: 27
          ticks_per_rev: 700
      drive_right:
        role: drive
        driver: dc
        motor: b
        invert: true
        encoder:
          pin_a: 22
          pin_b: 23
          ticks_per_rev: 700
      head_tilt:
        role: tilt
        driver: servo
        channel: 0
        min_deg: -25
        max_deg: 40
        max_deg_s: 160
      lift_arm:
        role: lift
        driver: servo
        channel: 1
        min_deg: 0
        max_deg: 90
        max_deg_s: 120
    geometry:
      wheel_diameter_mm: 40
      track_width_mm: 95
  C:
    layout: C
    drivers:
      dc:
        type: none
      servo:
        type: pca9685
        i2c_address: 64
        pwm_hz: 50
        oe_pin: 16
    channels:
      head_pan:
        role: pan
        driver: servo
        channel: 0
        min_deg: -70
        max_deg: 70
      head_tilt:
        role: tilt
        driver: servo
        channel: 1
        min_deg: -30
        max_deg: 35
      arm_left:
        role: arm_left
        driver: servo
        channel: 2
        min_deg: 0
        max_deg: 120
      arm_right:
        role: arm_right
        driver: servo
        channel: 3
        min_deg: 0
        max_deg: 120
