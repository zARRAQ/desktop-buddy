# /etc/asound.conf for the MAX98357A I2S amplifier (dtoverlay=max98357a).
# Gives a software volume control and lets several processes play at once.
# Card name: check `aplay -l`; it is usually "MAX98357A" (sndrpimax98357a).
pcm.!default {
    type plug
    slave.pcm "softvol"
}
pcm.softvol {
    type softvol
    slave.pcm "dmixer"
    control { name "Robot Volume"; card 0 }
    max_dB 0.0
}
pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        period_time 0
        period_size 1024
        buffer_size 8192
        rate 48000
        channels 2
    }
}
ctl.!default {
    type hw
    card 0
}
